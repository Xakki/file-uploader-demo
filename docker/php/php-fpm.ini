memory_limit = 256M

error_reporting = E_ALL
; display_errors off: errors must not leak into JSON/download responses (they would
; corrupt the body + trigger "headers already sent"). They go to stderr → fluent-bit
; instead (log_errors); caught exceptions are still returned as JSON error envelopes.
display_errors = 0
log_errors = 1
error_log = /proc/self/fd/2
short_open_tag = on

; Uploads go in 1 MB chunks (widget default); 2 MB covers one chunk + multipart overhead.
upload_max_filesize = 2M
post_max_size = 2M

[opcache]
; Off so host edits to the bind-mounted app (./src, public/) are picked up on the
; next request without a container restart — this is the live-debug switch.
opcache.enable = 0
opcache.enable_cli = 0
