[global]
daemonize = no

;; see: https://github.com/docker-library/php/issues/241
[www]
listen = /run/sock/php-fpm.sock
listen.mode = 0666
access.log = /dev/null

; Pass the container environment (STORAGE, S3_*) through to workers — the demo
; reads config via getenv(), which php-fpm otherwise strips (clear_env defaults yes).
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200
pm.process_idle_timeout = 60s
