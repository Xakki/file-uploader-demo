server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;

    # Static assets (e.g. the widget UMD) are served straight from public/;
    # everything else falls through to the single front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Package icons (logo, favicon) from the file-uploader core package's assets
    # dir, bind-mounted read-only at /app/assets. `^~` takes priority over the
    # regex dotfile guard below; cached since icons are versioned with the package.
    location ^~ /assets/ {
        alias /app/assets/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Browsers auto-probe /favicon.ico; the real favicon is the SVG <link> in <head>
    # (-> /assets/logo-icon.svg). Silence the legacy probe instead of routing it
    # through index.php and rendering a full 404 page.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Pure front controller: the only PHP that runs is public/index.php, which
    # routes by REQUEST_URI (/, /dl, /file-upload/*). Hardcoding SCRIPT_FILENAME
    # prevents executing any other .php path.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/sock/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
